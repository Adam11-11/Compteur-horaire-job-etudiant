<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" shape-rendering="crispEdges">
  <!-- Fond sombre assorti au thème -->
  <rect width="24" height="24" fill="#18171c"/>

  <!-- Halo doré subtil derrière la poêle -->
  <rect x="6" y="4" width="12" height="16" fill="#2d261e"/>
  <rect x="4" y="6" width="16" height="12" fill="#2d261e"/>

  <!-- Anses rouges de la paellera -->
  <rect x="1" y="10" width="2" height="5" fill="#8c2a34"/>
  <rect x="1" y="11" width="1" height="3" fill="#d94b57"/>
  <rect x="1" y="11" width="1" height="1" fill="#eb7c85"/>
  <rect x="2" y="10" width="1" height="1" fill="#d94b57"/>
  <rect x="2" y="14" width="1" height="1" fill="#8c2a34"/>

  <rect x="21" y="10" width="2" height="5" fill="#8c2a34"/>
  <rect x="22" y="11" width="1" height="3" fill="#d94b57"/>
  <rect x="22" y="11" width="1" height="1" fill="#eb7c85"/>
  <rect x="21" y="10" width="1" height="1" fill="#d94b57"/>
  <rect x="21" y="14" width="1" height="1" fill="#8c2a34"/>

  <!-- Contour extérieur de la poêle -->
  <rect x="8" y="4" width="8" height="17" fill="#0d0c10"/>
  <rect x="6" y="5" width="12" height="15" fill="#0d0c10"/>
  <rect x="4" y="7" width="16" height="11" fill="#0d0c10"/>
  <rect x="3" y="9" width="18" height="7" fill="#0d0c10"/>

  <!-- Bord métallique de la paellera -->
  <rect x="8" y="5" width="8" height="15" fill="#4e4959"/>
  <rect x="6" y="6" width="12" height="13" fill="#4e4959"/>
  <rect x="5" y="7" width="14" height="11" fill="#4e4959"/>
  <rect x="4" y="9" width="16" height="7" fill="#4e4959"/>

  <!-- Reflets métalliques brillants sur le bord -->
  <rect x="8" y="5" width="5" height="1" fill="#c7c1d4"/>
  <rect x="6" y="6" width="2" height="1" fill="#f2ece4"/>
  <rect x="5" y="7" width="1" height="2" fill="#c7c1d4"/>
  <rect x="4" y="9" width="1" height="2" fill="#9c95ab"/>
  <rect x="13" y="19" width="3" height="1" fill="#8d869c"/>
  <rect x="18" y="15" width="1" height="2" fill="#8d869c"/>

  <!-- Riz safrané (base dorée) -->
  <rect x="8" y="6" width="8" height="13" fill="#e5b567"/>
  <rect x="6" y="7" width="12" height="11" fill="#e5b567"/>
  <rect x="5" y="9" width="14" height="7" fill="#e5b567"/>

  <!-- Texture du riz & reflets brillants -->
  <rect x="7" y="8" width="2" height="1" fill="#f7dc79"/>
  <rect x="10" y="7" width="2" height="1" fill="#f2c94c"/>
  <rect x="14" y="7" width="2" height="1" fill="#d19a3e"/>
  <rect x="6" y="10" width="1" height="2" fill="#f7dc79"/>
  <rect x="9" y="10" width="2" height="1" fill="#d19a3e"/>
  <rect x="12" y="10" width="2" height="1" fill="#f7dc79"/>
  <rect x="15" y="11" width="2" height="1" fill="#f2c94c"/>
  <rect x="8" y="13" width="2" height="1" fill="#f2c94c"/>
  <rect x="11" y="14" width="2" height="1" fill="#d19a3e"/>
  <rect x="16" y="13" width="2" height="1" fill="#d19a3e"/>
  <rect x="9" y="17" width="3" height="1" fill="#d19a3e"/>
  <rect x="13" y="17" width="2" height="1" fill="#f7dc79"/>

  <!-- Gambas / Crevette (haut gauche) -->
  <rect x="7" y="8" width="3" height="1" fill="#d94b57"/>
  <rect x="6" y="9" width="2" height="2" fill="#f06a5a"/>
  <rect x="7" y="11" width="2" height="1" fill="#d94b57"/>
  <rect x="7" y="9" width="1" height="1" fill="#ffb8ae"/>

  <!-- Gambas / Crevette (bas droite) -->
  <rect x="15" y="14" width="2" height="1" fill="#d94b57"/>
  <rect x="16" y="15" width="2" height="2" fill="#f06a5a"/>
  <rect x="14" y="16" width="2" height="1" fill="#d94b57"/>
  <rect x="16" y="15" width="1" height="1" fill="#ffb8ae"/>

  <!-- Moule (haut droite) -->
  <rect x="14" y="8" width="3" height="2" fill="#2e2640"/>
  <rect x="15" y="7" width="2" height="1" fill="#4e446b"/>
  <rect x="15" y="9" width="1" height="1" fill="#f08c3a"/>

  <!-- Moule (bas gauche) -->
  <rect x="6" y="14" width="3" height="2" fill="#2e2640"/>
  <rect x="6" y="13" width="2" height="1" fill="#4e446b"/>
  <rect x="7" y="15" width="1" height="1" fill="#f08c3a"/>

  <!-- Quartier de citron au centre -->
  <rect x="10" y="11" width="4" height="2" fill="#ffe875"/>
  <rect x="11" y="13" width="2" height="1" fill="#f2c94c"/>
  <rect x="11" y="11" width="2" height="1" fill="#fff9d6"/>

  <!-- Petits pois -->
  <rect x="12" y="8" width="1" height="1" fill="#5ab57a"/>
  <rect x="17" y="12" width="1" height="1" fill="#5ab57a"/>
  <rect x="8" y="12" width="1" height="1" fill="#82d99d"/>
  <rect x="12" y="16" width="1" height="1" fill="#5ab57a"/>
  <rect x="10" y="15" width="1" height="1" fill="#82d99d"/>

  <!-- Poivron rouge -->
  <rect x="11" y="9" width="2" height="1" fill="#d94b57"/>
  <rect x="9" y="16" width="2" height="1" fill="#eb7c85"/>

  <!-- Étoiles scintillantes (effet brillant) -->
  <rect x="19" y="2" width="1" height="3" fill="#ffe875"/>
  <rect x="18" y="3" width="3" height="1" fill="#ffe875"/>
  <rect x="19" y="3" width="1" height="1" fill="#ffffff"/>

  <rect x="4" y="3" width="1" height="3" fill="#ffe875"/>
  <rect x="3" y="4" width="3" height="1" fill="#ffe875"/>
  <rect x="4" y="4" width="1" height="1" fill="#ffffff"/>

  <rect x="19" y="19" width="1" height="1" fill="#fff9d6"/>
</svg>
